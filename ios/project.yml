# The Xcode project is generated: `cd ios && xcodegen`. The core comes from tools/build_core.sh.
name: OnAir
options:
  bundleIdPrefix: net.rizos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 7KUJHBBE4P
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_OPTIMIZATION_LEVEL: -O   # the spectrum's per-pixel loops are too slow unoptimised, also while developing
targets:
  OnAir:
    type: application
    platform: iOS
    sources: [App/OnAir]
    postCompileScripts:
      - name: Embed voice codecs
        basedOnDependencyAnalysis: false
        script: |
          from="$SRCROOT/build/$PLATFORM_NAME/codecs"
          to="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$to"
          cp "$from"/*.dylib "$to"/
          for f in "$to"/*.dylib; do codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$f"; done
    info:
      path: App/OnAir/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSLocationWhenInUseUsageDescription: OnAir centres its maps on where you are.
    dependencies:
      - framework: build/OnAirCore.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CFNetwork.framework
      - sdk: CoreMotion.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: AVKit.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreLocation.framework
      - sdk: ImageIO.framework
      - sdk: MapKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: Security.framework
      - sdk: VideoToolbox.framework
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: libxml2.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.rizos.onair
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: OnAir connects to your PlutoSDR or rtl_tcp radio on the local network.
